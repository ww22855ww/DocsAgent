<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-label="放大二：看懂文件，並對到 ERP 主檔"><style>text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;fill:#131924}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.dim{opacity:.26}</style><rect width="900" height="512" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path></marker><marker id="ar-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"></path></marker><marker id="ar-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a2590a"></path></marker><marker id="ar-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a92420"></path></marker></defs><g id="viewport" transform="translate(0,0) scale(1)"><g><text x="450" y="36" text-anchor="middle" font-size="15" font-weight="700">一條線走完：看懂文件，再對到主檔</text><rect x="30" y="62" width="240" height="66" rx="10" fill="#f4f6fa" stroke="#d3d9e4"></rect><text x="150" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#131924">文件全文</text><text x="150" y="112" text-anchor="middle" font-size="11.5" fill="#3c4659">xlsx / csv / txt 解析後</text><path d="M 272 95 L 326 95" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></path><rect x="330" y="62" width="240" height="66" rx="10" fill="#efe8fd" stroke="#6d28d9"></rect><text x="450" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">① 分類</text><text x="450" y="112" text-anchor="middle" font-size="11.5" fill="#3c4659">全文送進模型判斷</text><path d="M 572 95 L 626 95" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ar-decide)"></path><rect x="630" y="62" width="240" height="66" rx="10" fill="#f4f6fa" stroke="#d3d9e4"></rect><text x="750" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#131924">抽出的欄位</text><text x="750" y="112" text-anchor="middle" font-size="11.5" fill="#3c4659">供應商 · 料號 · 單號</text><path d="M 750 128 L 750 156 L 450 156 L 450 180" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"></path><rect x="300" y="180" width="300" height="66" rx="10" fill="#e0f2f0" stroke="#0f766e"></rect><text x="450" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">② 查 Oracle EBS 主檔</text><text x="450" y="230" text-anchor="middle" font-size="11.5" fill="#3c4659">SQL 樣板寫死 · 單次約 50 毫秒</text><path d="M 450 246 L 450 272" stroke="currentColor" stroke-width="1.5"></path><path d="M 450 272 L 155 272 L 155 296" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"></path><path d="M 450 272 L 450 272 L 450 296" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"></path><path d="M 450 272 L 745 272 L 745 296" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"></path><rect x="30" y="298" width="250" height="86" rx="10" fill="#f4f6fa" stroke="#0f766e"></rect><text x="155" y="322" text-anchor="middle" font-size="11.5" class="mono" fill="#6b7588">unique</text><text x="155" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">唯一命中</text><text x="155" y="368" text-anchor="middle" font-size="11.5" fill="#3c4659">對應成立，直接歸檔</text><rect x="325" y="298" width="250" height="86" rx="10" fill="#f4f6fa" stroke="#92610a"></rect><text x="450" y="322" text-anchor="middle" font-size="11.5" class="mono" fill="#6b7588">ambiguous</text><text x="450" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#92610a">命中多筆</text><text x="450" y="368" text-anchor="middle" font-size="11.5" fill="#3c4659">不猜，轉人工複核</text><rect x="620" y="298" width="250" height="86" rx="10" fill="#f4f6fa" stroke="#92610a"></rect><text x="745" y="322" text-anchor="middle" font-size="11.5" class="mono" fill="#6b7588">not_found</text><text x="745" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#92610a">查不到</text><text x="745" y="368" text-anchor="middle" font-size="11.5" fill="#3c4659">轉人工複核</text><rect x="30" y="416" width="400" height="76" rx="10" fill="#efe8fd" stroke="#6d28d9"></rect><text x="230" y="442" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">紫色只有一格，也只有這一格看得到全文</text><text x="230" y="463" text-anchor="middle" font-size="11.5" fill="#3c4659">Agent 迴圈那次只拿到檔名和上一步結果</text><text x="230" y="482" text-anchor="middle" font-size="11.5" fill="#3c4659">mcp-worker 完全沒有呼叫模型的能力</text><rect x="470" y="416" width="400" height="76" rx="10" fill="#e0f2f0" stroke="#0f766e"></rect><text x="670" y="442" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">其餘每一格都是寫死的程式</text><text x="670" y="463" text-anchor="middle" font-size="11.5" fill="#3c4659">模型不產生 SQL，也不從多筆裡挑一筆</text></g></g></svg>