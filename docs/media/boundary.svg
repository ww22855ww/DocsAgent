<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-label="這套東西能不能落地，看這條線"><style>text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;fill:#131924}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.dim{opacity:.26}</style><rect width="900" height="512" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path></marker><marker id="ar-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"></path></marker><marker id="ar-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a2590a"></path></marker><marker id="ar-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a92420"></path></marker></defs><g id="viewport" transform="translate(0,0) scale(1)"><g><text x="450" y="52" text-anchor="middle" font-size="15" font-weight="700">落地的關鍵是這條線畫在哪裡</text><rect x="40" y="96" width="386" height="300" rx="12" fill="#efe8fd" stroke="#6d28d9"></rect><text x="233" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">模型決定「做什麼」</text><text x="233" y="172" text-anchor="middle" font-size="12.5" fill="#3c4659">要處理哪一批文件</text><text x="233" y="210" text-anchor="middle" font-size="12.5" fill="#3c4659">這份文件屬於哪一類</text><text x="233" y="248" text-anchor="middle" font-size="12.5" fill="#3c4659">缺代碼時改用什麼查</text><text x="233" y="286" text-anchor="middle" font-size="12.5" fill="#3c4659">查到多筆時該不該猜</text><text x="233" y="324" text-anchor="middle" font-size="12.5" fill="#3c4659">哪一份需要人來看</text><rect x="474" y="96" width="386" height="300" rx="12" fill="#e0f2f0" stroke="#0f766e"></rect><text x="667" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">程式決定「怎麼做」</text><text x="667" y="172" text-anchor="middle" font-size="12.5" fill="#3c4659">怎麼登入、點哪個按鈕</text><text x="667" y="210" text-anchor="middle" font-size="12.5" fill="#3c4659">SQL 長什麼樣子</text><text x="667" y="248" text-anchor="middle" font-size="12.5" fill="#3c4659">參數允許哪些字元</text><text x="667" y="286" text-anchor="middle" font-size="12.5" fill="#3c4659">寫進哪張表、搬到哪個目錄</text><text x="667" y="324" text-anchor="middle" font-size="12.5" fill="#3c4659">寄給誰、附件怎麼帶</text><line x1="450" y1="96" x2="450" y2="396" stroke="#d3d9e4" stroke-width="2"></line><text x="450" y="442" text-anchor="middle" font-size="13" fill="#3c4659">越線功能，可能累積技術債/降低流程易用性</text></g></g></svg>