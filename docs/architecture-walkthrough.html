<meta charset="utf-8">
<title>文件 Agent 架構導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ---------------------------------------------------------------------------
   Palette carries one idea: violet is a decision made by the model, teal is
   work carried out by deterministic code, amber is a system we do not own.
   That encoding repeats in every figure, so the distinction is learned by
   looking rather than by being told.
   Neutrals are biased slightly toward the blue accent already used by the demo
   application, so the two read as one family.
--------------------------------------------------------------------------- */
:root {
  --ground:      #eceff5;
  --surface:     #ffffff;
  --surface-sub: #f4f6fa;
  --line:        #d3d9e4;
  --line-soft:   #e4e8f0;
  --ink:         #131924;
  --ink-2:       #3c4659;
  --muted:       #6b7588;

  --accent:      #1d4ed8;
  --accent-soft: #e6ecfc;

  --decide:      #6d28d9;
  --decide-soft: #efe8fd;
  --do:          #0f766e;
  --do-soft:     #e0f2f0;
  --external:    #a2590a;
  --external-soft:#fbeed9;

  --warn:        #92610a;
  --warn-soft:   #fbf0da;
  --stop:        #a92420;
  --stop-soft:   #fbe9e8;

  --shadow: 0 1px 2px rgba(19, 25, 36, .05), 0 8px 24px -12px rgba(19, 25, 36, .18);

  --serif: "Noto Serif TC", "Songti TC", Georgia, serif;
  --sans:  "Noto Sans TC", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0e1117;
    --surface:     #161b24;
    --surface-sub: #1c222d;
    --line:        #2d3646;
    --line-soft:   #232b38;
    --ink:         #e9edf4;
    --ink-2:       #b9c2d2;
    --muted:       #8590a4;

    --accent:      #7aa2ff;
    --accent-soft: #1b2740;

    --decide:      #b794f6;
    --decide-soft: #2a1f45;
    --do:          #5ecfbf;
    --do-soft:     #10312e;
    --external:    #e5a95a;
    --external-soft:#3a2a12;

    --warn:        #e5b45c;
    --warn-soft:   #33270f;
    --stop:        #f08a84;
    --stop-soft:   #3a1c1a;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -14px rgba(0, 0, 0, .7);
  }
}

:root[data-theme="dark"] {
  --ground:      #0e1117;
  --surface:     #161b24;
  --surface-sub: #1c222d;
  --line:        #2d3646;
  --line-soft:   #232b38;
  --ink:         #e9edf4;
  --ink-2:       #b9c2d2;
  --muted:       #8590a4;

  --accent:      #7aa2ff;
  --accent-soft: #1b2740;

  --decide:      #b794f6;
  --decide-soft: #2a1f45;
  --do:          #5ecfbf;
  --do-soft:     #10312e;
  --external:    #e5a95a;
  --external-soft:#3a2a12;

  --warn:        #e5b45c;
  --warn-soft:   #33270f;
  --stop:        #f08a84;
  --stop-soft:   #3a1c1a;

  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px -14px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-width: 1360px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 0;
  gap: 0;
}

/* ---------------- top bar ---------------- */

.bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-block: 20px 14px;
  border-bottom: 1px solid var(--line-soft);
}

.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.brand h1 {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.22rem;
  margin: 0;
  letter-spacing: .01em;
  text-wrap: balance;
}

.brand .tag {
  font-size: .76rem;
  color: var(--muted);
  letter-spacing: .04em;
}

.counter {
  font-family: var(--mono);
  font-size: .8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.counter b { color: var(--ink); font-weight: 500; }

/* ---------------- body grid ---------------- */

.work {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(320px, 1fr);
  gap: 22px;
  padding-block: 20px;
  align-items: start;
}

/* ---------------- stage ---------------- */

.stage {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 420px;
  display: flex;
  flex-direction: column;
}

.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface-sub);
}

.stage-label {
  font-size: .72rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.zoom { display: flex; gap: 6px; align-items: center; }

.zoom button {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 7px;
  cursor: pointer;
  font-size: .95rem;
  font-family: var(--mono);
  line-height: 1;
}
.zoom button:hover { border-color: var(--accent); color: var(--accent); }
.zoom .level {
  font-family: var(--mono);
  font-size: .74rem;
  color: var(--muted);
  min-width: 46px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.canvas {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
  background-image: radial-gradient(var(--line-soft) 1px, transparent 1px);
  background-size: 22px 22px;
}
.canvas.dragging { cursor: grabbing; }
.canvas svg { display: block; width: 100%; height: 100%; }

.hint {
  position: absolute;
  left: 12px; bottom: 10px;
  font-size: .7rem;
  color: var(--muted);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  padding: 3px 8px;
  border-radius: 6px;
  pointer-events: none;
}

/* ---------------- explanation panel ---------------- */

.panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.act {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--accent);
  text-transform: uppercase;
}
.act::before {
  content: "";
  width: 18px; height: 2px;
  background: var(--accent);
  border-radius: 2px;
}

.panel h2 {
  font-family: var(--serif);
  font-size: 1.42rem;
  line-height: 1.35;
  margin: 6px 0 0;
  text-wrap: balance;
}

.lede {
  margin: 0;
  color: var(--ink-2);
  font-size: 1.02rem;
}

.points { display: flex; flex-direction: column; gap: 0; margin: 0; }

.point {
  padding: 13px 0;
  border-top: 1px solid var(--line-soft);
}
.point:first-child { border-top: 1px solid var(--line); }

.point h3 {
  margin: 0 0 3px;
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: .01em;
}
.point p { margin: 0; color: var(--ink-2); font-size: .92rem; }

.point code, .lede code, .callout code, table.cmp code {
  font-family: var(--mono);
  font-size: .84em;
  background: var(--surface-sub);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
  padding: 1px 5px;
}

.callout {
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 10px 10px 0;
  padding: 12px 14px;
  font-size: .9rem;
  color: var(--ink-2);
}
.callout b { color: var(--ink); }
.callout.decide { border-left-color: var(--decide); }
.callout.stop   { border-left-color: var(--stop); }
.callout.warn   { border-left-color: var(--warn); }

/* comparison table used on the closing steps */
table.cmp {
  width: 100%;
  border-collapse: collapse;
  font-size: .88rem;
}
table.cmp th, table.cmp td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
table.cmp thead th {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
table.cmp td.ok  { color: var(--do); font-weight: 500; }
table.cmp td.bad { color: var(--warn); }

/* ---------------- bottom rail ---------------- */

.rail {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding-block: 12px 22px;
  border-top: 1px solid var(--line-soft);
}

.steps {
  display: flex;
  gap: 4px;
  flex: 1;
  min-width: 220px;
  flex-wrap: wrap;
}

.steps button {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: .72rem;
  cursor: pointer;
  padding: 0;
  font-variant-numeric: tabular-nums;
}
.steps button:hover { border-color: var(--accent); color: var(--accent); }
.steps button[aria-current="step"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}
.steps .sep { width: 1px; background: var(--line); margin-inline: 6px; }

.nav { display: flex; gap: 8px; }

.nav button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 9px;
  padding: 8px 18px;
  font-size: .9rem;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
}
.nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.nav button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.nav button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
.nav button:disabled { opacity: .4; cursor: not-allowed; }

:where(button, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------------- legend ---------------- */

.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: .76rem;
  color: var(--muted);
  align-items: center;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i {
  width: 10px; height: 10px; border-radius: 3px; display: inline-block;
  border: 1px solid currentColor;
}
.legend .k-decide  { color: var(--decide); }
.legend .k-do      { color: var(--do); }
.legend .k-external{ color: var(--external); }

/* ---------------- SVG shared ---------------- */

svg text { font-family: var(--sans); fill: var(--ink); }
svg .mono { font-family: var(--mono); }
svg .dim { opacity: .26; transition: opacity .25s ease; }
svg .node-box { transition: opacity .25s ease; }

@media (prefers-reduced-motion: reduce) {
  svg .dim, svg .node-box { transition: none; }
}

/* ---------------- responsive ---------------- */

@media (max-width: 1000px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 340px; }
}

@media (max-width: 620px) {
  body { font-size: 14px; }
  .app { padding-inline: 14px; }
  .panel h2 { font-size: 1.2rem; }
  .nav button { flex: 1; padding: 10px 12px; }
  .rail { gap: 10px; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>文件 Agent 架構導覽</h1>
      <span class="tag">Agentic Document Processing · 部門例會</span>
    </div>
    <div class="counter"><b id="stepNo">1</b> / <span id="stepTotal">12</span> · <span id="actName">概念</span></div>
  </header>

  <div class="work">
    <section class="stage">
      <div class="stage-head">
        <span class="stage-label" id="figLabel">圖示</span>
        <div class="zoom">
          <button type="button" id="zoomOut" title="縮小 (−)" aria-label="縮小">−</button>
          <span class="level" id="zoomLevel">100%</span>
          <button type="button" id="zoomIn" title="放大 (+)" aria-label="放大">+</button>
          <button type="button" id="zoomReset" title="重設 (0)" aria-label="重設縮放">⟲</button>
        </div>
      </div>
      <div class="canvas" id="canvas">
        <svg id="figure" role="img" aria-label="流程與架構圖"></svg>
        <span class="hint">滾輪縮放 · 拖曳平移 · ← → 換頁</span>
      </div>
    </section>

    <aside class="panel">
      <div>
        <span class="act" id="actLabel">概念</span>
        <h2 id="title">標題</h2>
      </div>
      <p class="lede" id="lede"></p>
      <div class="points" id="points"></div>
      <div id="extra"></div>
      <div class="legend">
        <span class="k-decide"><i></i>模型決策</span>
        <span class="k-do"><i></i>程式執行</span>
        <span class="k-external"><i></i>既有內部服務</span>
      </div>
    </aside>
  </div>

  <footer class="rail">
    <div class="steps" id="steps"></div>
    <div class="nav">
      <button type="button" id="prev">← 上一步</button>
      <button type="button" id="next" class="primary">下一步 →</button>
    </div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // =========================================================================
  // Architecture model. Nodes are positioned on a grid once; every step picks
  // which of them are lit and which edges are drawn, so the audience keeps
  // looking at one consistent map instead of a new picture each slide.
  // =========================================================================

  var W = 900, H = 512;

  /* Four columns and two rows on a 150 x 72 grid. The column for each service
     is chosen so that every edge below has an empty vertical channel to run
     down: postgres sits under frontend rather than under agent-api, which is
     what frees the channel agent-api needs to reach the LLM. */
  var NODES = {
    browser:  { x: 42,  y: 24,  w: 150, h: 52, title: "瀏覽器",      sub: "使用者端，僅此一項",  kind: "plain" },
    frontend: { x: 42,  y: 136, w: 150, h: 64, title: "frontend",    sub: "nginx :5173",      kind: "do" },
    agentapi: { x: 264, y: 136, w: 150, h: 64, title: "agent-api",   sub: ".NET :5000",       kind: "mix" },
    worker:   { x: 486, y: 136, w: 150, h: 64, title: "mcp-worker",  sub: "Python :8000",     kind: "do" },
    portal:   { x: 708, y: 136, w: 150, h: 64, title: "mock-portal", sub: ".NET MVC :5100",   kind: "do" },
    postgres: { x: 42,  y: 244, w: 150, h: 60, title: "postgres",    sub: ":5432",            kind: "do" },
    llm:      { x: 264, y: 386, w: 150, h: 62, title: "LLM",         sub: "gemma4:26b",       kind: "ext" },
    dbq:      { x: 486, y: 386, w: 150, h: 62, title: "SQL 查詢 API", sub: "Oracle EBS",       kind: "ext" },
    mail:     { x: 708, y: 386, w: 150, h: 62, title: "Mail API",    sub: "Exchange",         kind: "ext" }
  };

  var BANDS = [
    { x: 24, y: 104, w: 852, h: 214, label: "伺服器端 · 正式環境部署在這裡，使用者電腦不用裝任何東西" },
    { x: 24, y: 356, w: 852, h: 124, label: "公司現有服務 · 已經在跑，這次沒有新增任何基礎設施" }
  ];

  /* Every edge carries explicit waypoints. Auto-routing kept putting labels on
     top of boxes and running two lines down the same channel; placing them by
     hand is a few more numbers and no ambiguity. `lp` is where the label sits. */
  var EDGES = {
    "browser>frontend": {
      from: "browser", to: "frontend", label: "HTTP / SSE",
      pts: [[117, 76], [117, 136]], lp: [117, 106]
    },
    "frontend>agentapi": {
      from: "frontend", to: "agentapi", label: "反向代理",
      pts: [[192, 168], [264, 168]], lp: [228, 168]
    },
    "agentapi>worker": {
      from: "agentapi", to: "worker", label: "MCP",
      pts: [[414, 168], [486, 168]], lp: [450, 168]
    },
    "worker>portal": {
      from: "worker", to: "portal", label: "Playwright",
      pts: [[636, 168], [708, 168]], lp: [672, 152]
    },
    "agentapi>postgres": {
      from: "agentapi", to: "postgres", label: "任務紀錄",
      pts: [[300, 200], [300, 222], [117, 222], [117, 244]], lp: [232, 222]
    },
    "worker>postgres": {
      from: "worker", to: "postgres", label: "歸檔與複核紀錄",
      pts: [[530, 200], [530, 238], [156, 238], [156, 244]], lp: [412, 238]
    },
    "agentapi>llm": {
      from: "agentapi", to: "llm", label: "OpenAI 相容", tone: "decide",
      pts: [[380, 200], [380, 386]], lp: [380, 300]
    },
    "worker>dbq": {
      from: "worker", to: "dbq", label: "固定 SQL", tone: "ext",
      pts: [[561, 200], [561, 386]], lp: [561, 300]
    },
    "worker>mail": {
      from: "worker", to: "mail", label: "寄出通知", tone: "ext",
      pts: [[600, 200], [600, 340], [783, 340], [783, 386]], lp: [700, 340]
    }
  };

  // =========================================================================
  // Concept figures. Hand-drawn because they show ideas, not the system.
  // =========================================================================

  function manualFigure() {
    var steps = ["登入入口網站", "設條件查詢", "逐份下載", "開檔看內容", "查供應商主檔", "建檔 / 轉人工"];
    var out = '<g>';
    out += '<text x="450" y="58" text-anchor="middle" font-size="15" font-weight="700">今天：一份文件走完要六個動作</text>';
    steps.forEach(function (s, i) {
      var x = 40 + i * 138, y = 110;
      out += '<rect x="' + x + '" y="' + y + '" width="116" height="74" rx="10" fill="var(--surface-sub)" stroke="var(--line)"/>';
      out += '<text x="' + (x + 58) + '" y="' + (y + 30) + '" text-anchor="middle" font-size="11" class="mono" fill="var(--muted)">' + (i + 1) + '</text>';
      out += '<text x="' + (x + 58) + '" y="' + (y + 52) + '" text-anchor="middle" font-size="12">' + s + '</text>';
      if (i < steps.length - 1) {
        out += '<line x1="' + (x + 118) + '" y1="' + (y + 37) + '" x2="' + (x + 134) + '" y2="' + (y + 37) + '" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>';
      }
    });
    out += '<rect x="40" y="228" width="816" height="70" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-dasharray="4 3"/>';
    out += '<text x="448" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="var(--warn)">每天一批文件，每一份都要重跑這六個動作</text>';
    out += '<text x="448" y="280" text-anchor="middle" font-size="12" fill="var(--ink-2)">動作本身不難，難在量大、重複，而且沒有人想做</text>';
    out += '</g>';
    return out;
  }

  function fixedFlowFigure() {
    var out = '<g>';
    out += '<text x="450" y="52" text-anchor="middle" font-size="15" font-weight="700">固定流程自動化：照著寫好的順序做</text>';
    var steps = ["下載", "解析", "讀供應商代碼", "查主檔", "建檔"];
    steps.forEach(function (s, i) {
      var x = 70 + i * 156, y = 96;
      var broken = i === 2;
      out += '<rect x="' + x + '" y="' + y + '" width="130" height="62" rx="10" fill="' +
        (broken ? "var(--stop-soft)" : "var(--do-soft)") + '" stroke="' + (broken ? "var(--stop)" : "var(--do)") + '"/>';
      out += '<text x="' + (x + 65) + '" y="' + (y + 37) + '" text-anchor="middle" font-size="13" fill="' +
        (broken ? "var(--stop)" : "var(--do)") + '" font-weight="500">' + s + '</text>';
      if (i < steps.length - 1) {
        out += '<line x1="' + (x + 132) + '" y1="' + (y + 31) + '" x2="' + (x + 152) + '" y2="' + (y + 31) + '" stroke="currentColor" stroke-width="1.4" ' +
          (i >= 2 ? 'stroke-dasharray="4 4" opacity=".35"' : '') + ' marker-end="url(#ar)"/>';
      }
    });
    out += '<path d="M 447 168 L 447 206" stroke="var(--stop)" stroke-width="1.6" marker-end="url(#ar-stop)"/>';
    out += '<rect x="250" y="212" width="394" height="92" rx="10" fill="var(--stop-soft)" stroke="var(--stop)"/>';

  /* Three ways to drive a screen, cheapest first. Geometry comes from named

  function automationFigure() {
    var LANE_X = 60, LANE_W = 780, ROW_H = 88, GAP = 16;

    var out = '<g>';
    out += '<text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700">操作網頁/視窗：由便宜到昂貴，壞掉才往下一層</text>';

    // Layer zero: the cheapest fix is not to need any of the three.
    out += '<rect x="' + LANE_X + '" y="56" width="' + LANE_W + '" height="50" rx="10" fill="var(--do-soft)" stroke="var(--do)" stroke-dasharray="5 4"/>';
    out += '<text x="450" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="var(--do)">第 0 層：先問有沒有 API，或能不能請對方在頁面加上 data-testid</text>';

    var layers = [
      { n: "1", tone: "var(--do)", soft: "var(--do-soft)",
        t: "固定或語意 selector（現在的做法）",
        d: '#btn-login，或 get_by_role("button", name="登入")',
        who: "程式決定元素", cost: "每次 ~1 秒 · 0 token" },
      { n: "2", tone: "var(--decide)", soft: "var(--decide-soft)",
        t: "自我修復：模型讀 DOM 挑出新的 selector",
        d: "純文字模型讀 accessibility tree，回傳 selector 寫回設定檔",
        who: "模型決定，一次", cost: "只有壞掉時才付" },
      { n: "3", tone: "var(--external)", soft: "var(--external-soft)",
        t: "Computer Use：每一步看畫面再決定",
        d: "沒有可用 DOM 語意時才需要：canvas、桌面程式、封閉 iframe",
        who: "模型決定，每一步", cost: "每步一次多模態呼叫" }
    ];

    layers.forEach(function (L, i) {
      var y = ROW_Y[i];
      out += '<rect x="' + LANE_X + '" y="' + y + '" width="' + LANE_W + '" height="' + ROW_H + '" rx="10" fill="' + L.soft + '" stroke="' + L.tone + '"/>';
      out += '<circle cx="' + (LANE_X + 32) + '" cy="' + (y + ROW_H / 2) + '" r="15" fill="var(--surface)" stroke="' + L.tone + '"/>';
      out += '<text x="' + (LANE_X + 32) + '" y="' + (y + ROW_H / 2 + 5) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + L.tone + '">' + L.n + '</text>';
      out += '<text x="' + TEXT_X + '" y="' + (y + 34) + '" font-size="13" font-weight="700" fill="' + L.tone + '">' + L.t + '</text>';
      out += '<text x="' + TEXT_X + '" y="' + (y + 58) + '" font-size="11.5" fill="var(--ink-2)">' + L.d + '</text>';
      out += '<text x="' + COST_X + '" y="' + (y + 34) + '" text-anchor="end" font-size="11.5" font-weight="700" fill="' + L.tone + '">' + L.who + '</text>';
      out += '<text x="' + COST_X + '" y="' + (y + 56) + '" text-anchor="end" font-size="11.5" fill="var(--ink-2)">' + L.cost + '</text>';

      if (i < layers.length - 1) {
        var top = y + ROW_H;
        out += '<path d="M 450 ' + top + ' L 450 ' + (top + GAP) + '" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>';

      }
    });

    // The line that matters more than the choice of layer.
    var FY = ROW_Y[2] + ROW_H + 18;
    out += '<rect x="' + LANE_X + '" y="' + FY + '" width="' + LANE_W + '" height="52" rx="10" fill="var(--warn-soft)" stroke="var(--warn)"/>';
    out += '<text x="450" y="' + (FY + 22) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--warn)">不論選哪一層，都要有每天一次的 smoke test</text>';

    out += '</g>';
    return out;
  }

  // =========================================================================
  // Architecture renderer
  // =========================================================================

  function nodeTone(kind) {
    if (kind === "ext") return { fill: "var(--external-soft)", stroke: "var(--external)", ink: "var(--external)" };
    if (kind === "do") return { fill: "var(--do-soft)", stroke: "var(--do)", ink: "var(--do)" };
    if (kind === "mix") return { fill: "var(--decide-soft)", stroke: "var(--decide)", ink: "var(--decide)" };
    return { fill: "var(--surface-sub)", stroke: "var(--line)", ink: "var(--ink)" };
  }

  /* CJK glyphs are roughly twice the width of Latin ones at the same size, so
     a plain character count sizes the label background wrong. */
  function labelWidth(text, size) {
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      w += text.charCodeAt(i) > 0x2e80 ? size * 1.02 : size * 0.56;
    }
    return w + 12;
  }

  function pathFrom(pts) {
    return pts.map(function (p, i) { return (i ? "L " : "M ") + p[0] + " " + p[1]; }).join(" ");
  }

  function archFigure(spec) {
    var active = spec.active || [];
    var edges = spec.edges || [];
    var out = "";

    BANDS.forEach(function (b) {
      out += '<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h +
             '" rx="14" fill="none" stroke="var(--line)" stroke-dasharray="6 5"/>';
      out += '<text x="' + (b.x + 16) + '" y="' + (b.y + 22) + '" font-size="11" fill="var(--muted)">' + b.label + '</text>';
    });

    edges.forEach(function (id) {
      var e = EDGES[id];
      if (!e) return;
      var color = e.tone === "decide" ? "var(--decide)" : e.tone === "ext" ? "var(--external)" : "currentColor";
      var marker = e.tone === "decide" ? "url(#ar-decide)" : e.tone === "ext" ? "url(#ar-ext)" : "url(#ar)";
      out += '<path d="' + pathFrom(e.pts) + '" fill="none" stroke="' + color +
             '" stroke-width="1.6" stroke-linejoin="round" marker-end="' + marker + '"/>';
      if (e.label) {
        var w = labelWidth(e.label, 10.5);
        out += '<rect x="' + (e.lp[0] - w / 2) + '" y="' + (e.lp[1] - 10) + '" width="' + w +
               '" height="20" rx="5" fill="var(--surface)"/>';
        out += '<text x="' + e.lp[0] + '" y="' + (e.lp[1] + 4) + '" text-anchor="middle" font-size="10.5" fill="' +
               (e.tone ? color : "var(--muted)") + '">' + e.label + '</text>';
      }
    });

    Object.keys(NODES).forEach(function (id) {
      var n = NODES[id], t = nodeTone(n.kind);
      var on = active.indexOf(id) >= 0;
      out += '<g class="node-box' + (on ? "" : " dim") + '">';
      out += '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="10" fill="' +
             t.fill + '" stroke="' + t.stroke + '" stroke-width="' + (on ? 1.6 : 1) + '"/>';
      out += '<text x="' + (n.x + n.w / 2) + '" y="' + (n.y + (n.sub ? 27 : 32)) +
             '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + t.ink + '">' + n.title + '</text>';
      if (n.sub) {
        out += '<text x="' + (n.x + n.w / 2) + '" y="' + (n.y + 45) +
               '" text-anchor="middle" font-size="10" class="mono" fill="var(--muted)">' + n.sub + '</text>';
      }
      out += '</g>';
    });

    return out;
  }

  var DEFS =
    '<defs>' +
    '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker>' +
    '<marker id="ar-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--decide)"/></marker>' +
    '<marker id="ar-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--external)"/></marker>' +
    '<marker id="ar-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--stop)"/></marker>' +
    '</defs>';

  // =========================================================================
  // View
  // =========================================================================

  var el = {
    fig: document.getElementById("figure"),
    canvas: document.getElementById("canvas"),
    title: document.getElementById("title"),
    lede: document.getElementById("lede"),
    points: document.getElementById("points"),
    extra: document.getElementById("extra"),
    act: document.getElementById("actLabel"),
    actName: document.getElementById("actName"),
    figLabel: document.getElementById("figLabel"),
    stepNo: document.getElementById("stepNo"),
    stepTotal: document.getElementById("stepTotal"),
    steps: document.getElementById("steps"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    zoomLevel: document.getElementById("zoomLevel")
  };

  var index = 0;
  var view = { k: 1, x: 0, y: 0 };

  function applyView() {
    var g = el.fig.querySelector("#viewport");
    if (g) g.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")");
    el.zoomLevel.textContent = Math.round(view.k * 100) + "%";
  }

  function resetView() { view = { k: 1, x: 0, y: 0 }; applyView(); }

  function zoomBy(factor, cx, cy) {
    var next = Math.min(3.2, Math.max(0.45, view.k * factor));
    if (cx === undefined) { cx = W / 2; cy = H / 2; }
    view.x = cx - (cx - view.x) * (next / view.k);
    view.y = cy - (cy - view.y) * (next / view.k);
    view.k = next;
    applyView();
  }

  function render() {
    var s = STEPS[index];

    el.fig.setAttribute("viewBox", "0 0 " + W + " " + H);
    el.fig.setAttribute("preserveAspectRatio", "xMidYMid meet");
    el.fig.setAttribute("aria-label", s.title);
    el.fig.innerHTML = DEFS + '<g id="viewport">' + (s.concept ? s.concept() : archFigure(s.arch)) + "</g>";
    applyView();

    el.act.textContent = s.act;
    el.actName.textContent = s.act;
    el.figLabel.textContent = s.fig;
    el.title.textContent = s.title;
    el.lede.textContent = s.lede;
    el.stepNo.textContent = String(index + 1);

    el.points.innerHTML = s.points.map(function (p) {
      return '<div class="point"><h3>' + p.h + "</h3><p>" + p.p + "</p></div>";
    }).join("");

    el.extra.innerHTML = s.extra || "";

    Array.prototype.forEach.call(el.steps.querySelectorAll("button"), function (b, i) {
      if (i === index) b.setAttribute("aria-current", "step");
      else b.removeAttribute("aria-current");
    });

    el.prev.disabled = index === 0;
    el.next.disabled = index === STEPS.length - 1;
    el.next.textContent = index === STEPS.length - 1 ? "已到最後一步" : "下一步 →";
  }

  function go(i) {
    index = Math.min(STEPS.length - 1, Math.max(0, i));
    resetView();
    render();
  }

  // step rail, with a divider wherever the act changes
  (function buildRail() {
    var html = "";
    STEPS.forEach(function (s, i) {
      if (i > 0 && STEPS[i - 1].act !== s.act) html += '<span class="sep"></span>';
      html += '<button type="button" data-i="' + i + '" title="' + s.title + '">' + (i + 1) + "</button>";
    });
    el.steps.innerHTML = html;
    el.stepTotal.textContent = String(STEPS.length);
    el.steps.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (b) go(parseInt(b.dataset.i, 10));
    });
  })();

  el.prev.addEventListener("click", function () { go(index - 1); });
  el.next.addEventListener("click", function () { go(index + 1); });
  document.getElementById("zoomIn").addEventListener("click", function () { zoomBy(1.25); });
  document.getElementById("zoomOut").addEventListener("click", function () { zoomBy(0.8); });
  document.getElementById("zoomReset").addEventListener("click", resetView);

  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { go(index + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { go(index - 1); e.preventDefault(); }
    else if (e.key === "+" || e.key === "=") { zoomBy(1.25); }
    else if (e.key === "-" || e.key === "_") { zoomBy(0.8); }
    else if (e.key === "0") { resetView(); }
  });

  // wheel zoom around the cursor, drag to pan
  el.canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = el.canvas.getBoundingClientRect();
    var scale = W / r.width;
    zoomBy(e.deltaY < 0 ? 1.12 : 0.89, (e.clientX - r.left) * scale, (e.clientY - r.top) * scale);
  }, { passive: false });

  (function enableDrag() {
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    el.canvas.addEventListener("pointerdown", function (e) {
      dragging = true; sx = e.clientX; sy = e.clientY; ox = view.x; oy = view.y;
      el.canvas.classList.add("dragging");
      el.canvas.setPointerCapture(e.pointerId);
    });
    el.canvas.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var r = el.canvas.getBoundingClientRect();
      var scale = W / r.width;
      view.x = ox + (e.clientX - sx) * scale;
      view.y = oy + (e.clientY - sy) * scale;
      applyView();
    });
    ["pointerup", "pointercancel"].forEach(function (ev) {
      el.canvas.addEventListener(ev, function (e) {
        dragging = false;
        el.canvas.classList.remove("dragging");
        try { el.canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      });
    });
  })();

  render();
})();
</script>
