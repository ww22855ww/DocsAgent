name: agentic-document-demo

services:

  postgres:
    image: postgres:18
    container_name: adp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [agent-network]

  mock-portal:
    build: ./mock-portal
    container_name: adp-mock-portal
    restart: unless-stopped
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [agent-network]

  mcp-worker:
    build: ./mcp-worker
    container_name: adp-mcp-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/downloads:/app/downloads
      - ./data/staging:/app/staging
      - ./data/archive:/app/archive
      - ./data/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [agent-network]

  agent-api:
    build: ./agent-api
    container_name: adp-agent-api
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [agent-network]

  frontend:
    build: ./frontend
    container_name: adp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - agent-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [agent-network]

networks:
  agent-network:
    driver: bridge

volumes:
  postgres-data:
